[project]
name = "underwriting-agent"
version = "0.1.0"
description = "Human-in-the-loop mortgage underwriting copilot"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "pinecone>=7.0,<9.0",
    "pydantic>=2.10,<3.0",
    "pypdf>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "streamlit>=1.40,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/underwriting_agent"]
